name: Code Complexity

# Runs on every PR commit, measures cyclomatic complexity across backend and frontend
# sources with lizard, and maintains a single structured PR comment with the top
# findings — the first run creates the comment, every later run updates it in place
# (located via the stable marker emitted by scripts/ci/format-complexity-report).
#
# The job also gates complexity regressions: it analyzes the PR's base branch, and
# scripts/ci/check-complexity-delta fails the job when the PR adds a function above
# the CCN threshold or worsens one that is already above it. Pre-existing complexity
# is reported but never fails the check.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: complexity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TOP_FINDINGS: "10"
  CCN_THRESHOLD: "15"
  SOURCE_DIRS: backend/src frontend/src
  LIZARD_LANGS: -l csharp -l typescript -l javascript

jobs:
  complexity:
    name: Complexity Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test report scripts
        run: |
          scripts/ci/format-complexity-report.test.sh
          scripts/ci/check-complexity-delta.test.sh

      - name: Install lizard and pytest
        run: pip install --break-system-packages lizard pytest

      - name: Self-test compute_codebase_metrics.py (pytest)
        run: python3 -m pytest scripts/ci/test_compute_codebase_metrics.py -v

      - name: Analyze PR head
        # --csv exits 0 even when functions exceed the threshold; -i -1 additionally
        # ignores the warning count. Gating happens in the delta step, not here.
        run: |
          python3 -m lizard $SOURCE_DIRS $LIZARD_LANGS \
            -C "$CCN_THRESHOLD" -i -1 --csv > complexity.csv

      - name: Analyze base branch
        # Fetch the base commit into a detached worktree and run lizard from inside it
        # so file paths in both CSVs are repo-relative and comparable. Falls back to
        # the base ref tip if the exact base SHA is no longer reachable (force-push).
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}" \
            || git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cd "$RUNNER_TEMP/base"
          dirs=""
          for d in $SOURCE_DIRS; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          python3 -m lizard $dirs $LIZARD_LANGS \
            -C "$CCN_THRESHOLD" -i -1 --csv > "$GITHUB_WORKSPACE/base-complexity.csv"

      - name: Evaluate complexity gate
        id: gate
        continue-on-error: true
        run: |
          scripts/ci/check-complexity-delta base-complexity.csv complexity.csv \
            --threshold "$CCN_THRESHOLD" > gate.md
          cat gate.md

      - name: Format report
        run: |
          scripts/ci/format-complexity-report complexity.csv \
            --top "$TOP_FINDINGS" \
            --threshold "$CCN_THRESHOLD" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --gate-file gate.md \
            > complexity-report.md
          cat complexity-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update PR comment
        # Skipped for PRs from forks: their GITHUB_TOKEN is read-only, so the job
        # summary above is the only output there.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- grimoire-complexity-report -->';
            const body = fs.readFileSync('complexity-report.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated complexity comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created complexity comment.');
            }

      - name: Enforce complexity gate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Complexity gate failed — this PR adds or worsens functions above CCN $CCN_THRESHOLD. Details are in the job summary, and on same-repo PRs also in the maintained PR comment."
          exit 1
