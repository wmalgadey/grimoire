name: CI

on:
  pull_request:
  # The merge queue builds each entry as its own `gh-readonly-queue/main/...` ref and runs
  # this workflow against it. Every check that main's ruleset marks required MUST trigger
  # here as well — a required check that only triggers on `pull_request` is never reported
  # for the merge group, and the queue sits on it until it times out and evicts the PR.
  merge_group:

permissions:
  contents: read

concurrency:
  # A pull request that gets pushed to ten times only needs the tenth run's verdict; the
  # nine superseded ones are pure spend. Merge-group runs are exempt from cancellation —
  # the queue is waiting on exactly that run, and cancelling it evicts the PR.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  ANTHROPIC_AUTH_TOKEN: ""

jobs:
  backend:
    name: Deterministic Backend Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion reads the git history and the tags to compute the build's version
          # (ADR-027); a shallow clone has neither and it fails rather than guessing.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install markitdown (003-ingest-intake-webui conversion adapter)
        # Pinned in step with .devcontainer/Dockerfile and deploy/Dockerfile — see the note
        # in deploy/Dockerfile for why the three move together.
        run: pip install --break-system-packages "markitdown==0.1.7"

      - name: Restore solution
        run: dotnet restore backend/Grimoire.slnx

      # Constitution Principle IV — a convention not enforced by CI does not exist, and this
      # one fails silently: a shallow checkout, an unfetched tag, or a GitVersion.yml that
      # stops matching the tag shape all leave the build compiling perfectly happily while
      # stamping the no-repository fallback into every assembly. Nothing downstream notices
      # until an operator asks a deployed Hub which version it is and it answers 0.0.0.
      - name: The build is versioned from the git history (ADR-027)
        run: |
          version=$(dotnet msbuild backend/src/Grimoire.Hub/Grimoire.Hub.csproj \
            -t:GetVersion -getProperty:Version -nologo)
          echo "GitVersion computed: ${version:-<nothing>}"
          case "$version" in
            ""|0.0.0-nogit|0.0.0*)
              echo "::error::GitVersion produced no version — see ADR-027. The checkout needs fetch-depth: 0 and the repository's tags."
              exit 1
              ;;
          esac

      - name: Build solution
        run: dotnet build backend/Grimoire.slnx --configuration Release --no-restore

      - name: Run linting and formatting checks
        run: dotnet format backend/Grimoire.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Run architecture tests
        run: dotnet test backend/tests/Grimoire.ArchTests --configuration Release --no-build

      - name: Run domain unit tests
        run: dotnet test backend/tests/Grimoire.Domain.UnitTests --configuration Release --no-build

      - name: Run hermetic integration tests
        run: dotnet test backend/tests/Grimoire.IntegrationTests --configuration Release --no-build

      # 009: replay agent evals — hermetic (recordings from
      # backend/tests/Grimoire.AgentEvals/Fixtures/recordings/, real agent process, zero
      # provider config/secrets). SC-008: zero skipped eval tests.
      # A stale/missing recording fails here — that failure IS the FR-016 merge gate for
      # instruction-file changes (refresh via the EvalRunner capture command or eval.yml).
      #
      # Merge-queue-only by design. These are the SlowEval tier (ADR-021): four replay
      # scenario classes that each spawn real agent processes, and they dominate this job's
      # runtime. FR-016 asks for fresh eval evidence *before the merge*, not before every
      # commit — so the gate belongs where the merge actually happens. In the queue it runs
      # once per pull request, against the merge commit that is genuinely going to main,
      # instead of once per push against a state nobody will ever ship.
      #
      # The `run-evals` label is the escape hatch: put it on a pull request that touches
      # instruction files or eval scenarios and you get the verdict during review rather
      # than at the merge attempt.
      - name: Run replay agent evals (hermetic, zero skips)
        if: >-
          github.event_name == 'merge_group'
          || contains(github.event.pull_request.labels.*.name, 'run-evals')
        timeout-minutes: 10
        run: |
          set -o pipefail
          dotnet test backend/tests/Grimoire.AgentEvals --configuration Release --no-build | tee agent-evals-output.txt
          if ! grep -Eq "Skipped:\s+0," agent-evals-output.txt; then
            echo "::error::Eval tests were skipped — SC-008 requires zero skipped eval tests in the standard suite."
            exit 1
          fi

  frontend:
    name: Frontend Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Type-check
        working-directory: frontend
        run: bun run check

      - name: Lint and format check
        working-directory: frontend
        run: bun run lint

      - name: Run tests
        working-directory: frontend
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build